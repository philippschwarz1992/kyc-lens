name: Bug report
description: Report a reproducible problem with KYC Lens.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md and use private reporting when available.
        Use fictional or synthetic examples. Do not attach real documents, face media, tokens, or personal data.
  - type: checkboxes
    id: preparation
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues for this problem.
          required: true
        - label: This report contains no sensitive media, credentials, or personal data.
          required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: Include the version of kyc-lens-react, or a commit for a source checkout.
      placeholder: "0.1.0 / commit hash"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system/device, React version, and framework. For build failures, include Node.js and npm versions.
      placeholder: "Chrome version, Windows version, React version, Vite/Next.js version"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Capture mode
      options:
        - Live camera
        - Simulation
        - Both
        - Build or integration issue
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include relevant props and a minimal reproduction when possible. Remove private configuration and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error messages and screenshots of synthetic examples when useful.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Workarounds, related issues, or regression information.
