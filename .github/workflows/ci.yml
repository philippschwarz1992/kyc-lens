name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare local assets
        run: npm run setup
      - name: Check types, unit tests, and package build
        run: npm run check
      - name: Build the playground
        run: npm run build:demo
      - name: Check the packed distribution
        run: npm run check:package

  browser:
    name: Browser / Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare local assets
        run: npm run setup
      - name: Install Chrome and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Run browser tests
        run: npm run test:e2e -- --workers=2 --reporter=html,line --trace=retain-on-failure
      - name: Save browser test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: chrome-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
