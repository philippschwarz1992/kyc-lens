[project]
name = "kyc-lens-analysis"
version = "0.1.0"
description = "Stateless document, face-match and liveness analysis for kyc-lens captures."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "av>=14",
  "fastapi>=0.115",
  "numpy>=2",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.12,<5",
  "pillow>=11",
  "python-multipart>=0.0.20",
  "rapidocr-onnxruntime>=1.4.4",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8"]

[tool.uv]
package = false
# rapidocr-onnxruntime asks for the GUI build of OpenCV; the headless build provides the same cv2 module.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
